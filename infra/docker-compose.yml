services:
  postgres:
    image: postgres:15-alpine
    container_name: chegae-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chegae
      POSTGRES_USER: chegae
      POSTGRES_PASSWORD: chegae
    volumes:
      - chegae_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chegae -d chegae"]
      interval: 5s
      timeout: 5s
      retries: 10

  graphdb:
    image: ontotext/graphdb:10.6.0
    container_name: chegae-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"

volumes:
  chegae_pgdata:
