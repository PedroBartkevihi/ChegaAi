services:
  postgres:
    image: postgres:15-alpine
    container_name: chegaai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chegaai
      POSTGRES_USER: chegaai
      POSTGRES_PASSWORD: chegaai
    volumes:
      - chegaai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chegaai -d chegaai"]
      interval: 5s
      timeout: 5s
      retries: 10

  graphdb:
    image: ontotext/graphdb:10.6.0
    container_name: chegaai-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    volumes:
      - chegaai_graphdb:/opt/graphdb/home

volumes:
  chegaai_pgdata:
  chegaai_graphdb:
