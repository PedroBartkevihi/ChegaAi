
# --- Servidor ---
server.port=8080
server.servlet.context-path=/api

# --- Datasource PostgreSQL ---
spring.datasource.url=${CHEGAE_DB_URL:jdbc:postgresql://localhost:5432/chegae}
spring.datasource.username=${CHEGAE_DB_USER:chegae}
spring.datasource.password=${CHEGAE_DB_PASSWORD:chegae}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=ChegAeHikariPool

# --- JPA / Hibernate ---
# O Flyway cria/atualiza o schema; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${CHEGAE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Desabilita o Open-Session-In-View para evitar lazy-loading silencioso
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=${CHEGAE_FLYWAY_ENABLED:true}
spring.flyway.locations=${CHEGAE_FLYWAY_LOCATIONS:filesystem:../database/postgres/migrations}
spring.flyway.baseline-on-migrate=${CHEGAE_FLYWAY_BASELINE_ON_MIGRATE:false}

# --- GraphDB (Ontotext) ---
chegae.graphdb.url=${CHEGAE_GRAPHDB_URL:http://localhost:7200}
chegae.graphdb.repositorio=${CHEGAE_GRAPHDB_REPOSITORY:chegae}
chegae.graphdb.ontologia-prefix=http://chegae.dev/ontology#
chegae.graphdb.foaf-prefix=http://xmlns.com/foaf/0.1/
chegae.graphdb.usuario-base-uri=http://chegae.dev/user/
chegae.graphdb.evento-base-uri=http://chegae.dev/evento/

# --- API ViaCEP ---
chegae.viacep.url=${CHEGAE_VIACEP_URL:https://viacep.com.br/ws}

# --- Regras de Negócio (valores configuráveis) ---
# RN003: threshold de honra para Embaixador
chegae.regras.honra-embaixador=4.8

# RN003: limite de vagas para Embaixador
chegae.regras.limite-vagas-embaixador=50

# RN003: limite de vagas para participantes comuns
chegae.regras.limite-vagas-padrao=20

# RN004: honra mínima para criar eventos
chegae.regras.honra-minima-criacao=2.0

# RN004: honra mínima para se inscrever em eventos
chegae.regras.honra-minima-inscricao=3.0

# RN005: honra mínima antes do banimento automático
chegae.regras.honra-banimento-automatico=1.0

# RN005: quantidade de denúncias validadas para banimento automático
chegae.regras.denuncias-banimento-automatico=3

# RN008: dedução de honra por ausência não justificada
chegae.regras.deducao-honra-ausencia=0.5

# RN009: janela de cancelamentos tardios (em dias)
chegae.regras.janela-cancelamento-tardio-dias=30

# RN009: máximo de cancelamentos tardios na janela
chegae.regras.max-cancelamentos-tardios=3

# RN009: suspensão por cancelamentos em excesso (em dias)
chegae.regras.suspensao-cancelamento-dias=7

# RN010: quórum mínimo para validade das avaliações
chegae.regras.quorum-minimo-avaliacao=3

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# --- Logging ---
logging.level.root=INFO
logging.level.chegae=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
