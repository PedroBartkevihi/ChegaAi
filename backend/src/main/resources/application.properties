
# --- Servidor ---
# O Render (e outros PaaS) informa a porta pela variável PORT
server.port=${PORT:8080}
server.servlet.context-path=/api
# Atrás de proxy (Render), respeita X-Forwarded-* ao montar URLs, como as do Swagger
server.forward-headers-strategy=framework

# Tomcat — limitar threads para alinhar com o pool de conexões DB
# Evita thread starvation: 50 threads disputando 30 conexões é aceitável;
# 200 (default) disputando 30 geraria fila no HikariCP e inflaria p95.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10

# Compressão GZIP — reduz payload do JSON no feed de eventos (S1)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# --- Datasource PostgreSQL ---
spring.datasource.url=${CHEGAAI_DB_URL:jdbc:postgresql://localhost:5432/chegaai}
spring.datasource.username=${CHEGAAI_DB_USER:chegaai}
spring.datasource.password=${CHEGAAI_DB_PASSWORD:chegaai}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP — otimizado para 30 VUs concorrentes (teste acadêmico)
spring.datasource.hikari.maximum-pool-size=${CHEGAAI_DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${CHEGAAI_DB_POOL_MIN:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=ChegaAiHikariPool
spring.datasource.hikari.leak-detection-threshold=10000

# --- JPA / Hibernate ---
# O Flyway cria/atualiza o schema; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${CHEGAAI_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
# Desabilita o Open-Session-In-View para evitar lazy-loading silencioso
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=${CHEGAAI_FLYWAY_ENABLED:true}
spring.flyway.locations=${CHEGAAI_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${CHEGAAI_FLYWAY_BASELINE_ON_MIGRATE:true}

# --- GraphDB (Ontotext) ---
chegaai.graphdb.url=${CHEGAAI_GRAPHDB_URL:http://localhost:7200}
chegaai.graphdb.repositorio=${CHEGAAI_GRAPHDB_REPOSITORY:chegaai}
chegaai.graphdb.ontologia-prefix=http://chegaai.dev/ontology#
chegaai.graphdb.foaf-prefix=http://xmlns.com/foaf/0.1/
chegaai.graphdb.usuario-base-uri=http://chegaai.dev/user/
chegaai.graphdb.evento-base-uri=http://chegaai.dev/evento/

# --- API ViaCEP ---
chegaai.viacep.url=${CHEGAAI_VIACEP_URL:https://viacep.com.br/ws}

# --- CORS: origens do front-end autorizadas a chamar a API (separadas por vírgula) ---
chegaai.cors.origens=${CHEGAAI_CORS_ORIGENS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

# --- Fuso horário em que as datas e horários dos eventos são exibidos ---
chegaai.fuso-horario=${CHEGAAI_FUSO_HORARIO:America/Sao_Paulo}

# --- Autenticação (JWT) ---
# Chave HMAC com no mínimo 32 bytes. Sem CHEGAAI_JWT_SECRET, a API gera uma chave aleatória a cada
# inicialização (os tokens deixam de valer quando ela reinicia). Em produção, defina a variável.
chegaai.jwt.secret=${CHEGAAI_JWT_SECRET:}
chegaai.jwt.expiracao-minutos=${CHEGAAI_JWT_EXPIRACAO_MINUTOS:120}

# --- Demonstração ---
# true: a cada inicialização, apaga as contas de demonstração (e o que é delas) e semeia de novo,
# com datas atuais. Contas e eventos reais não são tocados. Usado na versão online.
chegaai.demo.recriar-ao-iniciar=${CHEGAAI_DEMO_RECRIAR:false}

# --- Regras de Negócio (valores configuráveis) ---
# Honra com que um usuário recém-cadastrado começa (precisa alcançar a honra mínima de inscrição)
chegaai.regras.honra-inicial=3.0

# RN003: threshold de honra para Embaixador
chegaai.regras.honra-embaixador=4.8

# RN003: limite de vagas para Embaixador
chegaai.regras.limite-vagas-embaixador=50

# RN003: limite de vagas para participantes comuns
chegaai.regras.limite-vagas-padrao=20

# RN004: honra mínima para criar eventos
chegaai.regras.honra-minima-criacao=2.0

# RN004: honra mínima para se inscrever em eventos
chegaai.regras.honra-minima-inscricao=3.0

# RN005: honra mínima antes do banimento automático
chegaai.regras.honra-banimento-automatico=1.0

# RN005: quantidade de denúncias validadas para banimento automático
chegaai.regras.denuncias-banimento-automatico=3

# RN008: dedução de honra por ausência não justificada
chegaai.regras.deducao-honra-ausencia=0.5

# RN009: janela de cancelamentos tardios (em dias)
chegaai.regras.janela-cancelamento-tardio-dias=30

# RN009: máximo de cancelamentos tardios na janela
chegaai.regras.max-cancelamentos-tardios=3

# RN009: suspensão por cancelamentos em excesso (em dias)
chegaai.regras.suspensao-cancelamento-dias=7

# RN010: quórum mínimo para validade das avaliações
chegaai.regras.quorum-minimo-avaliacao=3

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Actuator ---
# Só health e info. O cadastro é aberto, então "quem está logado" é qualquer pessoa: métricas e detalhes
# do health (banco, disco) ficariam públicos na prática.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Logging ---
logging.level.root=INFO
logging.level.chegaai=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
