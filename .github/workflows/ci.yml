name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (unitários + integração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # verify roda os testes unitários (surefire) e os *IT com PostgreSQL via Testcontainers (failsafe)
      - run: ./mvnw -B -ntp verify

  e2e:
    name: Ponta a ponta (export estático + CORS)
    runs-on: ubuntu-latest
    env:
      CHEGAAI_DB_URL: jdbc:postgresql://127.0.0.1:5432/chegaai_e2e
      CHEGAAI_DB_USER: chegaai_e2e
      CHEGAAI_DB_PASSWORD: chegaai_e2e
      CHEGAAI_CORS_ORIGENS: http://127.0.0.1:3000
      E2E_DATABASE_URL: postgresql://chegaai_e2e:chegaai_e2e@127.0.0.1:5432/chegaai_e2e
      E2E_API_BASE_URL: http://127.0.0.1:8080/api
      E2E_BASE_URL: http://127.0.0.1:3000
      # A suíte completa mantém o limitador ativo, mas seu IP de loopback cria centenas de dados próprios.
      CHEGAAI_LIMITE_LOGIN_IP: "1000000"
      CHEGAAI_LIMITE_LOGIN_PAR: "1000000"
      CHEGAAI_LIMITE_CADASTRO_IP: "1000000"
      CHEGAAI_LIMITE_CRIAR_EVENTO: "1000000"
      CHEGAAI_LIMITE_CRIAR_EVENTO_DIA: "1000000"
      CHEGAAI_LIMITE_COMENTAR: "1000000"
      CHEGAAI_LIMITE_COMENTAR_HORA: "1000000"
      E2E_MODE: static
      NEXT_OUTPUT: export
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: chegaai_e2e
          POSTGRES_USER: chegaai_e2e
          POSTGRES_PASSWORD: chegaai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chegaai_e2e -d chegaai_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Empacotar a API
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Subir a API
        working-directory: backend
        run: |
          nohup java -jar target/chegaai-backend-*.jar > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/actuator/health && exit 0
            sleep 2
          done
          cat api.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do front-end
        working-directory: frontend
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Testes da proteção de sessão
        working-directory: frontend
        run: npm run test:session
      - name: Testes do feed paginado
        working-directory: frontend
        run: npm run test:feed
      - name: Testes do gerador de relatório de carga
        run: node --test tests/load/tools/relatorio.test.mjs
      - name: Testes da CSP e dos cabeçalhos
        working-directory: frontend
        run: npm run test:security
      - name: Exportar o site estático
        working-directory: frontend
        run: npm run build
      - name: Testes ponta a ponta
        working-directory: frontend
        run: npx playwright test --repeat-each=2 --retries=0
      # Alguns segundos de cada script do k6 contra a API deste job, para eles não quebrarem sem ninguém ver.
      - name: Teste rápido dos scripts de carga (k6)
        run: |
          for script in eventos-feed comentarios-write; do
            docker run --rm --network host -v "$PWD/tests/load:/scripts:ro" \
              -e BASE_URL=http://127.0.0.1:8080/api -e LOAD_PROFILE=smoke -e REPORT_DIR=/tmp \
              grafana/k6:2.2.0 run --quiet "/scripts/$script.js"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            frontend/playwright-report/
            backend/api.log
          retention-days: 7
