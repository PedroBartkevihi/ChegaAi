# Blueprint do Render: só o front-end, como site estático (plano gratuito; site estático
# não dorme). A API roda no Google Cloud Run e o banco no Neon; veja o DEPLOY.md.
services:
  - type: web
    name: chegaai-web
    runtime: static
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: frontend/out
    # Reconstruir quando o front-end ou a configuração de publicação mudar
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_OUTPUT
        value: export
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # URL pública da API no Cloud Run, terminando em /api
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
